name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck -- --pretty false --incremental false

      - name: Build
        run: npm run build

      - name: Start production server
        env:
          INTERNAL_ACCESS_PASSWORD: playwright-internal-access
        run: |
          nohup npx next start --port 43210 --hostname 127.0.0.1 > next-start.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:43210/; then
              echo "next start answered after ${attempt} s"
              exit 0
            fi
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: E2E on the production build
        env:
          PLAYWRIGHT_SKIP_WEB_SERVER: "1"
          PW_MODE: production
        run: npm run test:e2e

      - name: Server log on failure
        if: failure()
        run: cat next-start.log || true
