<!-- @dsCard group="Foundations" name="Spacing & radius" subtitle="4px base, 8-64 scale, radius 12/16/22" -->
<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../_base.css">
<style>.bar{background:var(--info);height:12px;border-radius:4px}.r{background:var(--surface);border:1px solid var(--border);width:96px;height:64px}</style></head>
<body><p class="kicker">Foundations</p><h1 class="title" style="font-size:24px;margin-top:8px">여백과 모서리</h1>
<p class="copy" style="max-width:640px;margin-top:8px">모든 여백은 4px 단위. 히어로 최대 폭 1152px, 결과 최대 폭 1024px. 모바일 좌우 16px, 데스크톱 24px.</p>
<div class="stack" style="margin-top:24px;max-width:520px">
<div class="row"><div class="bar" style="width:8px"></div><span class="label">8</span></div>
<div class="row"><div class="bar" style="width:16px"></div><span class="label">16</span></div>
<div class="row"><div class="bar" style="width:24px"></div><span class="label">24</span></div>
<div class="row"><div class="bar" style="width:32px"></div><span class="label">32</span></div>
<div class="row"><div class="bar" style="width:48px"></div><span class="label">48</span></div>
<div class="row"><div class="bar" style="width:64px"></div><span class="label">64</span></div>
</div>
<div class="row" style="margin-top:28px">
<div><div class="r" style="border-radius:12px"></div><div class="label">radius-md 12px · 버튼/입력</div></div>
<div><div class="r" style="border-radius:16px"></div><div class="label">radius-lg 16px · 카드</div></div>
<div><div class="r" style="border-radius:22px"></div><div class="label">radius-xl 22px · 조회 패널</div></div>
</div></body></html>
